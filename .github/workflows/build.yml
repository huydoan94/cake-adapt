name: Build OpenWrt package

on:
  push:
    # A tag builds and publishes its release. On main, only a change of
    # PKG_VERSION or PKG_RELEASE builds; it then creates tag v<PKG_VERSION>
    # and its release in this run, because a tag pushed with GITHUB_TOKEN
    # starts no workflow.
    tags: ["v*"]
    branches: [main]
    paths: [Makefile]
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_NAME: cake-adapt
  OPENWRT_REF: openwrt-25.12
  SDK_VERSION_SUFFIX: "-openwrt-25.12"

jobs:
  version:
    name: Check package version
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare PKG_VERSION and PKG_RELEASE with the previous commit
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version() { sed -n 's/^PKG_VERSION:=//p; s/^PKG_RELEASE:=//p' | paste -sd- -; }
          current=$(version < Makefile)
          tag="v$(sed -n 's/^PKG_VERSION:=//p' Makefile)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != push ] || [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "Not a branch push: build."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous=
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            previous=$(git show "$BEFORE:Makefile" | version)
          fi
          if [ "$current" = "$previous" ]; then
            echo "Version $current unchanged: skip."
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "Version changed to $current, but $tag already exists and its push built it: skip."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version changed from ${previous:-none} to $current: build and release $tag."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Host tests
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y libnl-3-dev zlib1g-dev
      - name: Run unit and netlink tests
        run: make -C tests check check-netlink

  generate-matrix:
    name: Discover OpenWrt architectures
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      arches: ${{ steps.dump.outputs.arches }}
    steps:
      - name: Checkout OpenWrt metadata
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: ${{ env.OPENWRT_REF }}
          path: openwrt
          fetch-depth: 1

      - name: Dump distinct architectures
        id: dump
        working-directory: openwrt
        run: |
          set -euo pipefail
          arches=$(perl scripts/dump-target-info.pl architectures | awk '{print $1}' | sort -u)
          printf '%s\n' "$arches"
          json=$(printf '%s\n' "$arches" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          jq -e 'length > 0' <<< "$json" > /dev/null
          echo "arches=$json" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: [test, generate-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.generate-matrix.outputs.arches) }}
    steps:
      # gh-action-sdk mounts $GITHUB_WORKSPACE as the feed root and scans
      # it one level deep for <pkgname>/Makefile. Checking out straight
      # into the workspace root put Makefile at the root itself (too
      # shallow to be seen as a package) -> "No rule to make target
      # 'package/cake-adapt/download'". Checking out into a subfolder
      # named after the package fixes it: workspace/cake-adapt/Makefile.
      - uses: actions/checkout@v4
        with:
          path: ${{ env.PACKAGE_NAME }}
          fetch-depth: 0

      - name: Build cake-adapt for ${{ matrix.arch }}
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}${{ env.SDK_VERSION_SUFFIX }}
          PACKAGES: ${{ env.PACKAGE_NAME }}
          NO_REFRESH_CHECK: true
          IGNORE_ERRORS: n

      - name: Collect cake-adapt packages
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          while IFS= read -r -d '' package; do
            cp "$package" "dist/${PACKAGE_ARCH}_$(basename "$package")"
          done < <(find "bin/packages/$PACKAGE_ARCH" -type f \( -name 'cake-adapt-*.apk' -o -name 'cake-adapt_*.ipk' \) -print0)
          test -n "$(find dist -type f -print -quit)"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.arch }}
          path: logs/

  release:
    name: Publish release assets
    needs: [version, build]
    # A push that reached here is a tag or a version change; a manual run
    # releases only when started on a tag.
    if: github.event_name == 'push' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      # On a tag push this is that tag; on main it creates the tag at this commit.
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
